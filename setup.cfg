[metadata]
name = chaos-intelligence
version = attr: chaos.version.__version__
description = Functional agent language and extensible multi-agent framework
long_description = file: README.md
long_description_content_type = text/markdown
author = Cattmonkey
url = https://github.com/Cattmonkey/ChaosIntelligence
license_expression = LicenseRef-Chaos-No-AI-Training-1.0
license_files =
    LICENSE
    THIRD_PARTY_NOTICES.md
    vendor/deepseek/LICENSE
    vendor/deepseek/upstream/LICENSE
    vendor/deepseek/upstream/vendor/cordis/LICENSE
    vendor/openui/LICENSE
    vendor/openui/THIRD_PARTY_LICENSES.txt
    web/vendor/LICENSES.txt

[options]
packages = find:
python_requires = >=3.9
include_package_data = True
install_requires =
    openai>=1.66,<3
    cryptography>=42,<47
    packaging>=23
    markdown-it-py>=3,<4

[options.extras_require]
mobile =
    Pillow>=10,<13
devices =
    pyserial>=3.5,<4
native =
    llvmlite>=0.45,<0.46; python_version >= "3.10"
gpu =
    torch>=2.2,<3; python_version >= "3.10"
browser =
    playwright>=1.49,<2

[options.packages.find]
include = chaos, chaos.*

[options.package_data]
chaos = *.json, stdlib/*.chaos

[options.entry_points]
console_scripts =
    chaos = chaos.cli:main
